[package]
name = "blyg-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "blygger"
path = "src/main.rs"

[dependencies]
blyg-core = { path = "../blyg-core" }
blyg-ai = { path = "../blyg-ai" }
# gpui-kit pins the matching GPUI snapshot (gpui-pre 0.3.6) plus gpui-base /
# gpui-component 0.6.6. We use gpui-base's unstyled textarea and draw the rest.
gpui-kit = { version = "=0.6.6", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
async-channel = "2"
global-hotkey = "0.8"
raw-window-handle = "0.6"
# --- full editor ---
blyg-render = { path = "../blyg-render" }
wry = { version = "0.57", default-features = false }
ammonia = "4"
# --- auto-update --- (signed release check + in-place install; src/update/)
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
semver = "1"
url = "2"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize"] }
# --- browser --- (the in-app browser pane; src/browser/). Brave's filter
# parser turns uBlock Origin / EasyList syntax into WebKit content-blocker
# JSON (MPL-2.0, used unmodified).
adblock = { version = "=0.13.3", default-features = false, features = ["content-blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
# AppKit calls for the Dock icon, window ordering and webview focus.
objc2 = "0.6"
# --- browser --- WKContentRuleListStore, the web view's configuration and its
# navigation delegate (the same versions wry already pulls in).
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "WKContentRuleList",
    "WKContentRuleListStore",
    "WKUserContentController",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebsiteDataStore",
    "WKPreferences",
    "WKWebpagePreferences",
    "WKNavigationAction",
    "WKNavigationDelegate",
    "WKFrameInfo",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSString",
    "NSURL",
    "NSError",
    "NSUUID",
    "NSArray",
    "NSEnumerator",
    "NSProcessInfo",
    # --- spellcheck ---
    "NSRange",
    "NSTextCheckingResult",
] }
block2 = "0.6"

# --- spellcheck --- (the system spell checker: NSSpellChecker)
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSSpellChecker"] }

[build-dependencies]
# Windows resources (icon, manifest); build.rs does nothing on other targets.
embed-resource = "3.0"

[dev-dependencies]
# --- full editor ---
tempfile = "3"
gpui-kit = { version = "=0.6.6", default-features = false, features = ["test-support"] }
