[package]
name = "blyg-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["keychain"]
# Real OS token storage: the macOS Keychain, or Windows Credential Manager.
# Tests never construct `KeychainTokenStore`.
keychain = ["dep:keyring"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
toml = "1"
url = "2"
keyring = { version = "3.6", features = ["apple-native", "windows-native"], optional = true }

[dev-dependencies]
tempfile = "3"
