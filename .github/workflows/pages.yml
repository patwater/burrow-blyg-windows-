name: Docs site

# Build the mdBook in site/ and publish it to GitHub Pages
# (https://aneeshsathe.github.io/blygger-desktop/). Needs Settings › Pages ›
# Source = "GitHub Actions". Pull requests build the book in ci.yml instead.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "crates/blyg-core/src/config/**"
      - "crates/blyg-app/src/keymap.rs"
      - "CHANGELOG.md"
      - "scripts/build-site.sh"
      - "scripts/site-linkcheck.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Downloads the pinned mdBook release (checksum-verified), builds, and
      # fails on mdBook errors or broken internal links.
      - name: Build the book
        run: scripts/build-site.sh

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
