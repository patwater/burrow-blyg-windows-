name: Release

# Merging a version bump to main releases it: when `version` in Cargo.toml
# has no `v<version>` tag yet (and CHANGELOG.md has its `## [x.y.z]`
# section), this builds, signs, tags that commit and publishes the release.
# Otherwise a cheap Linux check skips it. Run it by hand (workflow_dispatch)
# to retry a failed release.
#
# It runs on main, not on the tag, so Swatinem/rust-cache saves the build in
# main's cache scope and the next release reuses it: a cache saved on one
# tag can't be read from another, which made every tag build cold.
#
# Required repository secret:
#   UPDATE_SIGNING_KEY            PEM Ed25519 private key; signs SHA256SUMS as
#                                 SHA256SUMS.sig for in-app updates (the app
#                                 embeds the public key; see scripts/sign-sums.sh)
#
# Optional repository secrets (without them the app is ad-hoc signed, and users
# have to open it with right-click → Open the first time):
#   APPLE_DEVELOPER_ID_APP        "Developer ID Application: <Name> (<TEAMID>)"
#   APPLE_CERTIFICATE_P12_BASE64  base64 of the Developer ID .p12
#   APPLE_CERTIFICATE_PASSWORD    its password
#   Notarization, either an app-specific password:
#     APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
#   or an App Store Connect API key:
#     APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_API_KEY_P8_BASE64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Is there a version to release? (No Mac time spent when there isn't.)
  decide:
    # Windows port: upstream's macOS release is upstream's alone. This fork
    # releases Windows builds from windows.yml instead.
    if: github.repository == 'aneeshsathe/blygger-desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          REPO: ${{ github.repository }}
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          [ -n "$version" ] || { echo "::error::no version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags "https://github.com/$REPO.git" "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version isn't tagged yet: releasing it"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain and the Intel target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-universal

      - name: Check the tag, Cargo version, repo name and changelog agree
        id: meta
        env:
          TAG: v${{ needs.decide.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          version="$(cargo pkgid -p blyg-app | sed -E 's/.*[#@]//')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG doesn't match Cargo version $version"
            exit 1
          fi
          configured="$(grep -E '^GITHUB_REPO=' packaging/config.env | cut -d= -f2)"
          if [ "$configured" != "$REPO" ]; then
            echo "::warning::packaging/config.env says GITHUB_REPO=$configured but this is $REPO"
          fi
          scripts/changelog-notes.sh "$version" > "$RUNNER_TEMP/notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - name: Require the update signing key
        env:
          HAS_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::the UPDATE_SIGNING_KEY secret is missing; in-app updates need a signed SHA256SUMS"
            exit 1
          fi

      # crates/blyg-app/build.rs embeds `git rev-parse --short HEAD` (plus
      # "-dirty" when `git status --porcelain` lists anything) for the About
      # window. The checkout above is a git repository, so the SHA is real;
      # make sure it isn't marked dirty.
      - name: Check the commit the About window will show
        run: |
          git rev-parse --short HEAD
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::the tree is dirty before the build; the app would say <sha>-dirty"
            exit 1
          fi

      - name: Build, sign and package (universal)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          APPLE_DEVELOPER_ID_APP: ${{ secrets.APPLE_DEVELOPER_ID_APP }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: scripts/bundle.sh --arch universal

      # In-app updates only install a release whose SHA256SUMS carries a valid
      # Ed25519 signature from this key. The script signs with Homebrew's
      # OpenSSL 3, writes the key to a 0600 temp file (never echoed, deleted
      # after), and verifies the signature with the public key embedded in
      # the app, so a wrong key fails the job instead of shipping.
      - name: Sign SHA256SUMS for in-app updates
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: scripts/sign-sums.sh dist/SHA256SUMS

      - name: Note an unsigned build in the release notes
        env:
          SIGNED: ${{ secrets.APPLE_DEVELOPER_ID_APP != '' }}
        run: |
          if [ "$SIGNED" != "true" ]; then
            cat >> "$RUNNER_TEMP/notes.md" <<'EOF'

          ---
          This build isn't notarized by Apple. The easiest way to install it is the
          one-line Terminal installer in the README, which Gatekeeper doesn't block.
          If you download it in a browser, macOS 15 and later say "Burrow" Not
          Opened. Try opening it once, then click **Open Anyway** in System Settings ›
          Privacy & Security, or run
          `xattr -dr com.apple.quarantine /Applications/Burrow.app`.
          EOF
          fi

      # The Blygger-… zips are the same signed app under its old name (see
      # "the old name" in scripts/bundle.sh): 0.6.0 and earlier only update
      # from Blygger-<version>-macos-universal.zip holding Blygger.app, and
      # SHA256SUMS (signed above) covers them like every other asset. Keep
      # uploading them until 0.6.0 and earlier are rare.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.decide.outputs.version }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          # Tags the commit this run built.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Burrow $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}" \
            dist/Burrow-"$VERSION"-macos-universal.dmg \
            dist/Burrow-"$VERSION"-macos-universal.zip \
            dist/Burrow-macos-universal.dmg \
            dist/Burrow-macos-universal.zip \
            dist/Blygger-"$VERSION"-macos-universal.zip \
            dist/Blygger-macos-universal.zip \
            dist/SHA256SUMS \
            dist/SHA256SUMS.sig
